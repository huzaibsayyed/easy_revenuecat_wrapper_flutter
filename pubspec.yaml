name: easy_revenuecat_wrapper_flutter
description: A simple and flexible Flutter package to integrate RevenueCat with minimal setup.
version: 0.0.2
homepage: https://github.com/huzaibsayyed/easy_revenuecat_wrapper_flutter
repository: https://github.com/huzaibsayyed/easy_revenuecat_wrapper_flutter
issue_tracker: https://github.com/huzaibsayyed/easy_revenuecat_wrapper_flutter/issues
platforms:
  android:
  ios:
topics:
  - revenuecat
  - in-app-purchases
  - subscription

environment:
  sdk: ^3.13.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  purchases_flutter: ^10.9.0
  purchases_ui_flutter: ^10.9.0
  shared_preferences: ^2.5.5
  logging: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

